name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check script.js && node --check farm-advice.js && node --check sw.js
      - run: npm test
      - name: Build the site the same way Vercel does
        run: npm run build && test -f dist/farm-advice.js
